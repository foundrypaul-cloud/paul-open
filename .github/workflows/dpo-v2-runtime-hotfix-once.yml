name: Apply DPO V2 Runtime Hotfix Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dpo-v2-runtime-hotfix-once.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply exact runtime compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          train = Path('scripts/dpo_v2_e4b_train.py')
          text = train.read_text(encoding='utf-8')

          old_projection = '    lm_head = causal_model.get_output_embeddings()\n'
          new_projection = '    lm_head = getattr(causal_model, "lm_head", None)\n'
          if text.count(old_projection) != 1:
              raise SystemExit(f'expected one old Gemma projection accessor, found {text.count(old_projection)}')
          text = text.replace(old_projection, new_projection, 1)

          old_preflight = '''        if args.preflight_only:\n            print("DPO V2 PRODUCTION PREFLIGHT: PASS")\n            return\n'''
          new_preflight = '''        if args.preflight_only:\n            # Exercise the exact production reference + policy loss path without\n            # backward/optimizer updates so API-contract failures are caught before\n            # a production kernel is launched.\n            install_runtime_memory_instrumentation(\n                trainer, policy, reference, torch, telemetry_state\n            )\n            try:\n                probe_batch = next(iter(trainer.get_train_dataloader()))\n            except StopIteration as error:\n                raise RuntimeError("Cannot run production-loss preflight on an empty dataloader") from error\n            prepared_probe = trainer._prepare_inputs(probe_batch)\n            with torch.no_grad(), trainer.compute_loss_context_manager():\n                probe_loss = trainer.compute_loss(policy, prepared_probe)\n            if not torch.isfinite(probe_loss.detach()).all().item():\n                raise RuntimeError("Non-finite production policy loss during preflight")\n            if trainable_digest(trainable) != pre_train_digest:\n                raise RuntimeError("Preflight changed trainable parameters")\n            print("DPO V2 PRODUCTION PREFLIGHT: PASS")\n            return\n'''
          if text.count(old_preflight) != 1:
              raise SystemExit(f'expected one old preflight return block, found {text.count(old_preflight)}')
          text = text.replace(old_preflight, new_preflight, 1)
          train.write_text(text, encoding='utf-8')

          test = Path('tests/test_dpo_v2_policy_logps_equivalence.py')
          t = test.read_text(encoding='utf-8')
          old_accessor = '''\n        def get_output_embeddings(self):\n            return self.lm_head\n'''
          if t.count(old_accessor) != 1:
              raise SystemExit(f'expected one synthetic get_output_embeddings accessor, found {t.count(old_accessor)}')
          t = t.replace(old_accessor, '', 1)
          test.write_text(t, encoding='utf-8')
          PY

          git diff --check
          git diff -- scripts/dpo_v2_e4b_train.py tests/test_dpo_v2_policy_logps_equivalence.py

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest torch trl transformers peft datasets accelerate

      - name: Run locked DPO verification suites
        run: |
          pytest -q \
            tests/test_dpo_v2_e4b_final_gates.py \
            tests/test_dpo_v2_policy_logps_equivalence.py

      - name: Commit tested patch to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PAUL Foundry.'
          git config user.email 'foundrypaul@gmail.com'
          git add scripts/dpo_v2_e4b_train.py tests/test_dpo_v2_policy_logps_equivalence.py
          git diff --cached --quiet && { echo 'No patch to commit'; exit 1; }
          git commit -m 'fix: validate Gemma4 production projection before training'
          git push origin HEAD:main
