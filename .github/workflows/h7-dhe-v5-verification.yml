name: H7 DHE V5 Verification

on:
  pull_request:
    paths:
      - 'data/h7_dhe_v5_pilot_v1.jsonl'
      - 'configs/evaluation/h7_dhe_v5_pilot_v1.yaml'
      - 'scripts/h7_dhe_generate.py'
      - 'docs/H7_DHE_V5_PRECOMMIT_SPEC.md'
      - 'docs/DPO_V5_P11_P12_RESULTS.md'
      - '.github/workflows/h7-dhe-v5-verification.yml'
      - '.github/workflows/h7-dhe-v5-kaggle-generation.yml'

permissions:
  contents: read

jobs:
  verify-h7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository environment
        run: |
          python -m pip install --upgrade uv
          uv sync --frozen --extra eval
      - name: Verify frozen H7 contract, candidate binding and development separation
        run: |
          uv run python - <<'PY'
          import json, unicodedata
          from pathlib import Path
          import yaml

          manifest=Path('data/h7_dhe_v5_pilot_v1.jsonl')
          rows=[json.loads(x) for x in manifest.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==6, len(rows)
          ids=[r['case_id'] for r in rows]
          prompts=[r['prompt'] for r in rows]
          assert ids==[f'H7-DHE-{i:03d}' for i in range(1,7)], ids
          assert len(ids)==len(set(ids)) and len(prompts)==len(set(prompts))
          assert all(r['partition']=='development' for r in rows)
          assert all(r['development_exposed'] is True for r in rows)
          expected=[
              ('science_reasoning','en','stem_capable'),
              ('socratic_tutoring','en','educator'),
              ('scientific_research_assistance','en','domain_expert'),
              ('scientific_explanation','hi','bilingual'),
              ('scientific_explanation','bn','bilingual'),
              ('evidence_first_human_centered','es','bilingual'),
          ]
          assert [(r['domain'],r['language'],r['reviewer_cohort']) for r in rows]==expected

          cfg=yaml.safe_load(Path('configs/evaluation/h7_dhe_v5_pilot_v1.yaml').read_text(encoding='utf-8'))['h7_dhe_v5_pilot']
          assert cfg['version']=='1.0'
          assert cfg['status']=='frozen_pre_generation'
          assert cfg['partition']=='development'
          assert cfg['case_manifest']==str(manifest)
          assert cfg['prompt_freeze_revision']=='d890fdbbaa224ad9cdfbe38440b01e0a4bc8ed2d'
          assert cfg['sources']['reference']['adapter_config_sha256']=='cff65bd42928536886168b09d9b133b25ac444c01d901d2a56d98c7b8b03a0ce'
          assert cfg['sources']['reference']['adapter_weights_sha256']=='73bab121009e2130f387b5deebfe1d15f4f7ac2afbd622164b11b3024000ec49'
          candidate=cfg['sources']['candidate']
          assert candidate['experiment_id']=='paul_e4b_dpo_v5_corrective'
          assert candidate['source_revision']=='08a0857bbd5a93d58b8ca64a61625e69f68bf442'
          assert candidate['production_run']==34737466097
          assert candidate['production_artifact']==10311949786
          assert candidate['production_artifact_digest']=='sha256:baf68e48dbd3bb8c8a901265e9bbb2ff1e0899092789dc8a6c9c541c25145973'
          assert candidate['training_dataset_sha256']=='1584705bf332137ade1ee24873e5d463653a2b26e26c63f6dc9c87515618bbd4'
          assert candidate['adapter_config_sha256']=='2edf45ffe03f0f026acfd4c7ecb35df23275cd9edc3509e7e091115d6a9cd023'
          assert candidate['adapter_weights_sha256']=='9a5e26985ad85226dc67c6e056dd0856b721d084da4213f1d6fe3f4af19f549c'
          g=cfg['generation']
          assert g['matched_between_sources'] is True
          assert g['max_new_tokens']==768 and g['require_eos_before_limit'] is True
          assert g['temperature']==0.7 and g['top_p']==0.9 and g['random_seed']==42
          assert '300 words' in g['response_instruction'] and '1–2 minutes' in g['response_instruction']
          assert cfg['review_allocation']=={'initial_valid_judgments_per_case':3,'disagreement_escalation_total':5,'exceptional_hard_cap':7}
          assert cfg['prohibitions']['use_shae_material'] is False
          assert cfg['prohibitions']['revise_h7_prompts_after_candidate_output_inspection'] is False

          source=Path('scripts/h7_dhe_generate.py').read_text(encoding='utf-8')
          assert 'from scripts.h6_dhe_generate import' in source
          assert 'dpo_v5_corrective.jsonl' in source
          assert 'H7_DHE_V5_PILOT_V1' in source
          assert 'configs/training/dpo_v5_e4b_corrective.yaml' in source

          comparison=[]
          def add_jsonl(source_name,path,id_key='case_id'):
              p=Path(path)
              if not p.is_file(): return
              for line in p.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      r=json.loads(line); comparison.append((source_name,r.get(id_key,r.get('id','?')),r['prompt']))
          for name,path in [('h4','data/h4_dhe_pilot_v1.jsonl'),('h5','data/h5_dhe_v3_pilot_v1.jsonl'),('h6','data/h6_dhe_v4_pilot_v1.jsonl')]:
              add_jsonl(name,path)
          add_jsonl('dpo_v1','data/train/dpo_train.jsonl','id')
          add_jsonl('dpo_v2','data/train/dpo_v2_corrective.jsonl','id')
          for version in ('dpo_v3','dpo_v4','dpo_v5'):
              for shard in sorted(Path('data/train',version).glob('*.jsonl')):
                  add_jsonl(version,str(shard),'id')
          assert not set(prompts).intersection({q for _,_,q in comparison})

          def toks(text):
              text=unicodedata.normalize('NFKC',text).casefold(); out=[]; cur=[]
              for ch in text:
                  cat=unicodedata.category(ch)
                  if cat[0] in {'L','N','M'} or ch=='_': cur.append(ch)
                  elif cur: out.append(''.join(cur)); cur=[]
              if cur: out.append(''.join(cur))
              return set(out)
          best=(0.0,None,None,None)
          for r in rows:
              a=toks(r['prompt'])
              for source_name,other_id,q in comparison:
                  b=toks(q); u=a|b; score=len(a&b)/len(u) if u else 0.0
                  if score>best[0]: best=(score,r['case_id'],source_name,other_id)
          assert best[0] < 0.35, best
          print(json.dumps({'status':'PASS','cases':6,'tokenizer':'unicode_letter_mark_word_v1','max_development_token_jaccard':best[0],'nearest_pair':best[1:]},sort_keys=True))
          PY
      - name: Run canonical benchmark leakage checker
        run: uv run python scripts/check_leakage.py data/h7_dhe_v5_pilot_v1.jsonl --json-output /tmp/h7_baseline_leakage_report.json --verbose
      - name: Verify H7 generation entry point imports
        run: uv run python scripts/h7_dhe_generate.py --help >/dev/null
