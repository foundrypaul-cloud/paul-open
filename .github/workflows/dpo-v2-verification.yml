name: DPO V2 Verification

on:
  pull_request:
    paths:
      - "scripts/dpo_v2_e4b_*.py"
      - "tests/test_dpo_v2_e4b_final_gates.py"
      - "tests/test_dpo_v2_policy_logps_equivalence.py"
      - ".github/workflows/dpo-v2-verification.yml"
  push:
    branches:
      - main
      - codex/authorize-kaggle-dpo-v2-training-run
    paths:
      - "scripts/dpo_v2_e4b_*.py"
      - "tests/test_dpo_v2_e4b_final_gates.py"
      - "tests/test_dpo_v2_policy_logps_equivalence.py"
      - ".github/workflows/dpo-v2-verification.yml"

permissions:
  contents: read

jobs:
  dpo-v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest torch trl transformers peft datasets accelerate

      - name: Run DPO V2 verification suites
        run: |
          pytest -q \
            tests/test_dpo_v2_e4b_final_gates.py \
            tests/test_dpo_v2_policy_logps_equivalence.py
