name: Kaggle DPO V2 Preflight

on:
  push:
    branches:
      - codex/authorize-kaggle-dpo-v2-training-run
    paths:
      - '.github/workflows/kaggle-dpo-v2-preflight.yml'
      - 'scripts/dpo_v2_e4b_train.py'
      - 'scripts/dpo_v2_e4b_smoke.py'
      - 'configs/training/dpo_v2_e4b_corrective.yaml'
      - 'requirements.txt'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-kaggle-preflight:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      REPO_URL: https://github.com/foundrypaul-cloud/paul-open.git
      TARGET_COMMIT: ${{ github.sha }}
      KAGGLE_KERNEL_SLUG: paul-open-dpo-v2-pr4-preflight
      MACHINE_SHAPE: NvidiaTeslaT4

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Verify Kaggle authentication and resolve account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          kaggle auth print-access-token --expiration 5m >/dev/null
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          import urllib.request

          token = os.environ['KAGGLE_API_TOKEN']
          request = urllib.request.Request(
              'https://www.kaggle.com/api/v1/account/current',
              headers={'Authorization': f'Bearer {token}'},
          )
          with urllib.request.urlopen(request) as response:
              account = json.load(response)
          username = account.get('username') or account.get('displayName')
          if not username:
              raise SystemExit('Unable to resolve Kaggle username from authenticated account')
          print(f'KAGGLE_USERNAME={username}')
          PY
          echo "Kaggle authentication: OK"

      - name: Resolve historical SFT adapter dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ['KAGGLE_API_TOKEN']
          queries = [
              'paul open sft adapter',
              'paul-open-sft-adapter',
              'paul open sft',
          ]
          headers = {'Authorization': f'Bearer {token}'}
          candidates = []
          for query in queries:
              url = 'https://www.kaggle.com/api/v1/datasets/list?' + urllib.parse.urlencode({'search': query})
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  rows = json.load(response)
              for row in rows:
                  ref = row.get('ref')
                  title = (row.get('title') or '').lower()
                  if ref and ('sft' in ref.lower() or 'sft' in title) and ('paul' in ref.lower() or 'paul' in title):
                      candidates.append(ref)
          seen = []
          for ref in candidates:
              if ref not in seen:
                  seen.append(ref)
          if not seen:
              raise SystemExit('Could not auto-resolve the historical PAUL Open SFT adapter dataset from Kaggle')
          print(f'ADAPTER_DATASET={seen[0]}')
          print(f'ADAPTER_DATASET_CANDIDATES={";".join(seen)}')
          PY
          echo "Resolved adapter dataset: $ADAPTER_DATASET"

      - name: Build exact-head private preflight kernel
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_DIR="$RUNNER_TEMP/paul-open-kaggle-preflight"
          mkdir -p "$KERNEL_DIR"

          cat > "$KERNEL_DIR/preflight.py" <<'PY'
          import subprocess
          from pathlib import Path

          repo_url = '__PAUL_REPO_URL__'
          target_commit = '__PAUL_TARGET_COMMIT__'
          adapter_dataset = '__PAUL_ADAPTER_DATASET__'
          repo_dir = Path('/kaggle/working/paul-open')

          subprocess.run(['git', 'clone', repo_url, str(repo_dir)], check=True)
          subprocess.run(['git', '-C', str(repo_dir), 'checkout', target_commit], check=True)
          actual = subprocess.check_output(['git', '-C', str(repo_dir), 'rev-parse', 'HEAD'], text=True).strip()
          if actual != target_commit:
              raise SystemExit(f'commit mismatch: expected {target_commit}, got {actual}')

          subprocess.run(['python', '-m', 'pip', 'install', '-r', str(repo_dir / 'requirements.txt')], check=True)

          adapter_root = Path('/kaggle/input') / adapter_dataset.split('/', 1)[-1]
          candidates = list(adapter_root.rglob('adapter_config.json'))
          if not candidates:
              raise SystemExit(f'No adapter_config.json found under {adapter_root}')
          adapter_dir = candidates[0].parent

          subprocess.run([
              'python', str(repo_dir / 'scripts' / 'dpo_v2_e4b_train.py'),
              '--config', str(repo_dir / 'configs' / 'training' / 'dpo_v2_e4b_corrective.yaml'),
              '--adapter', str(adapter_dir),
              '--preflight-only',
          ], cwd=repo_dir, check=True)
          PY

          python - "$KERNEL_DIR/preflight.py" <<'PY'
          import os
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = text.replace('__PAUL_REPO_URL__', os.environ['REPO_URL'])
          text = text.replace('__PAUL_TARGET_COMMIT__', os.environ['TARGET_COMMIT'])
          text = text.replace('__PAUL_ADAPTER_DATASET__', os.environ['ADAPTER_DATASET'])
          path.write_text(text)
          PY

          cat > "$KERNEL_DIR/kernel-metadata.json" <<JSON
          {
            "id": "${KAGGLE_USERNAME}/${KAGGLE_KERNEL_SLUG}",
            "title": "PAUL Open DPO V2 PR4 Preflight",
            "code_file": "preflight.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": "true",
            "enable_gpu": "true",
            "enable_internet": "true",
            "machine_shape": "${MACHINE_SHAPE}",
            "dataset_sources": ["${ADAPTER_DATASET}"],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          JSON

          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

      - name: Push and start Kaggle preflight
        run: kaggle kernels push -p "$KERNEL_DIR"

      - name: Show Kaggle kernel status
        run: kaggle kernels status "$KAGGLE_USERNAME/$KAGGLE_KERNEL_SLUG"
