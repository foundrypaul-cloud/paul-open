name: One-shot Public Boundary Remediation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-public-boundary-remediation.yml'

permissions:
  actions: write
  contents: write

jobs:
  remediate:
    if: github.repository == 'foundrypaul-cloud/paul-open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Make expensive Kaggle workflows manual-only
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            '.github/workflows/kaggle-dpo-v3-production.yml'
            '.github/workflows/kaggle-dpo-v4-production.yml'
            '.github/workflows/kaggle-dpo-v5-production.yml'
            '.github/workflows/h6-dhe-v4-failure-evidence.yml'
          )
          for path in "${paths[@]}"; do
            echo "Hardening trigger: ${path}"
            meta=$(mktemp)
            decoded=$(mktemp)
            patched=$(mktemp)
            request=$(mktemp)
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" > "$meta"
            sha=$(jq -r '.sha' "$meta")
            jq -r '.content' "$meta" | tr -d '\n' | base64 -d > "$decoded"
            python - "$decoded" "$patched" <<'PY'
          import pathlib, re, sys
          src = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          pattern = re.compile(
              r"on:\n  workflow_dispatch:\n  push:\n    branches: \[main\]\n    paths:\n(?:      - .+\n)+\npermissions:",
              re.MULTILINE,
          )
          dst, count = pattern.subn("on:\n  workflow_dispatch:\n\npermissions:", src, count=1)
          if count != 1:
              raise SystemExit('expected exactly one automatic main-push trigger block')
          pathlib.Path(sys.argv[2]).write_text(dst, encoding='utf-8')
          PY
            content=$(base64 -w0 < "$patched")
            jq -n \
              --arg message "security: make Kaggle evidence workflow manual-only" \
              --arg content "$content" \
              --arg sha "$sha" \
              --arg branch "main" \
              '{message:$message,content:$content,sha:$sha,branch:$branch}' > "$request"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" --input "$request" >/dev/null
          done

      - name: Verify no automatic production push triggers remain
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            '.github/workflows/kaggle-dpo-v3-production.yml'
            '.github/workflows/kaggle-dpo-v4-production.yml'
            '.github/workflows/kaggle-dpo-v5-production.yml'
            '.github/workflows/h6-dhe-v4-failure-evidence.yml'
          )
          for path in "${paths[@]}"; do
            meta=$(mktemp)
            decoded=$(mktemp)
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" > "$meta"
            jq -r '.content' "$meta" | tr -d '\n' | base64 -d > "$decoded"
            python - "$decoded" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          prefix = text.split('permissions:', 1)[0]
          if 'push:' in prefix:
              raise SystemExit('automatic push trigger still present')
          if 'workflow_dispatch:' not in prefix:
              raise SystemExit('manual workflow_dispatch trigger missing')
          PY
          done
