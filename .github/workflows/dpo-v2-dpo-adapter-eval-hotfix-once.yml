name: Dispatch Corrected DPO V2 Workflow Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dpo-v2-dpo-adapter-eval-hotfix-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected Kaggle DPO V2 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run kaggle-dpo-v2-preflight.yml \
            --repo foundrypaul-cloud/paul-open \
            --ref main
