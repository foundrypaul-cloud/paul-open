name: H5 DHE V3 Verification

on:
  pull_request:
    paths:
      - 'data/h5_dhe_v3_pilot_v1.jsonl'
      - 'configs/evaluation/h5_dhe_v3_pilot_v1.yaml'
      - 'scripts/h5_dhe_generate.py'
      - '.github/workflows/h5-dhe-v3-verification.yml'
      - '.github/workflows/h5-dhe-v3-kaggle-generation.yml'

permissions:
  contents: read

jobs:
  verify-h5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository environment
        run: |
          python -m pip install --upgrade uv
          uv sync --frozen --extra eval
      - name: Verify frozen H5 contract and development separation
        run: |
          uv run python - <<'PY'
          import json, re
          from pathlib import Path
          import yaml

          manifest=Path('data/h5_dhe_v3_pilot_v1.jsonl')
          rows=[json.loads(x) for x in manifest.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==6, len(rows)
          ids=[r['case_id'] for r in rows]
          prompts=[r['prompt'] for r in rows]
          assert len(ids)==len(set(ids))
          assert len(prompts)==len(set(prompts))
          assert all(r['partition']=='development' for r in rows)
          assert all(r['development_exposed'] is True for r in rows)
          assert set(r['reviewer_cohort'] for r in rows)=={'stem_capable','educator','domain_expert','bilingual','general_user'}

          cfg=yaml.safe_load(Path('configs/evaluation/h5_dhe_v3_pilot_v1.yaml').read_text(encoding='utf-8'))['h5_dhe_v3_pilot']
          assert cfg['status']=='frozen_pre_generation'
          assert cfg['partition']=='development'
          assert cfg['generation']['max_new_tokens']==256
          assert cfg['generation']['temperature']==0.7
          assert cfg['generation']['top_p']==0.9
          assert cfg['generation']['random_seed']==42
          assert cfg['sources']['candidate']['experiment_id']=='paul_e4b_dpo_v3_corrective'
          assert cfg['sources']['candidate']['source_revision']=='dff8c34ca148c436bdb0bc06e0ce27ddfb9a821f'
          assert cfg['sources']['candidate']['adapter_config_sha256']=='1ccc60a7f99368638a8ececb17aa6060c09a0648c42fdd678463108026ab22c9'
          assert cfg['sources']['candidate']['adapter_weights_sha256']=='afcbc55e58aefb4ca72e5c7e3d5ac3362fe6b489477000a77cfa27b53ca76bd3'

          comparison=[]
          h4=[json.loads(x) for x in Path('data/h4_dhe_pilot_v1.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          comparison += [('h4',r['case_id'],r['prompt']) for r in h4]
          for shard in sorted(Path('data/train/dpo_v3').glob('*.jsonl')):
              for line in shard.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      r=json.loads(line); comparison.append(('dpo_v3_train',r['id'],r['prompt']))
          forbidden_exact={q for _,_,q in comparison}
          assert not set(prompts).intersection(forbidden_exact), 'exact H4/V3-training prompt reuse'

          def toks(s): return set(re.findall(r'\w+',s.lower(),flags=re.UNICODE))
          best=(0.0,None,None,None)
          for r in rows:
              a=toks(r['prompt'])
              for source,other_id,q in comparison:
                  b=toks(q); u=a|b
                  score=len(a&b)/len(u) if u else 0.0
                  if score>best[0]: best=(score,r['case_id'],source,other_id)
          assert best[0] < 0.35, f'development overlap too high: {best}'
          print(json.dumps({'cases':len(rows),'max_development_token_jaccard':best[0],'nearest_pair':best[1:]},sort_keys=True))
          PY
      - name: Run canonical benchmark leakage checker
        run: |
          uv run python scripts/check_leakage.py data/h5_dhe_v3_pilot_v1.jsonl --json-output /tmp/h5_baseline_leakage_report.json --verbose
      - name: Verify H5 generation entry point imports
        run: |
          uv run python scripts/h5_dhe_generate.py --help >/dev/null
