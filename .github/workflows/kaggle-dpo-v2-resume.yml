name: Kaggle DPO V2 Production Resume

# Operational-only watcher for an already-launched production kernel.
# It never pushes/relaunches training and therefore cannot duplicate the locked experiment.
# Private Kaggle output is never uploaded directly from this public repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resume-existing-production:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: paulfoundry
      KAGGLE_PRODUCTION_SLUG: paul-open-dpo-v2-pr4-production

    steps:
      - name: Check out sanitizer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Verify Kaggle authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          kaggle kernels status "$KAGGLE_USERNAME/$KAGGLE_PRODUCTION_SLUG"

      - name: Resume waiting for existing production training and evaluation
        id: production_wait
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 900); do
            STATUS=$(kaggle kernels status "$KAGGLE_USERNAME/$KAGGLE_PRODUCTION_SLUG" || true)
            echo "$STATUS"
            if echo "$STATUS" | grep -qi 'complete'; then
              exit 0
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancel'; then
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for existing production training/evaluation; no relaunch was attempted."
          exit 1

      - name: Download private production output to runner temp
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_OUTPUT="$RUNNER_TEMP/kaggle-dpo-v2-private"
          mkdir -p "$PRIVATE_OUTPUT"
          kaggle kernels output "$KAGGLE_USERNAME/$KAGGLE_PRODUCTION_SLUG" -p "$PRIVATE_OUTPUT" || true
          echo "PRIVATE_OUTPUT=$PRIVATE_OUTPUT" >> "$GITHUB_ENV"

      - name: Build aggregate-only public evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-evidence
          python scripts/sanitize_kaggle_public_evidence.py \
            --input "$PRIVATE_OUTPUT" \
            --output public-evidence/dpo-v2-production.json

      - name: Upload sanitized public evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-dpo-v2-public-evidence
          path: public-evidence/dpo-v2-production.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail if existing production training or evaluation failed
        if: steps.production_wait.outcome != 'success'
        run: exit 1
