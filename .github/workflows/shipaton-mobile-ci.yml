name: Shipaton Mobile CI

on:
  pull_request:
    paths:
      - 'apps/shipaton-mobile/**'
      - 'services/shipaton-ai/**'
      - 'docs/SHIPATON_2026_**'
      - '.github/workflows/shipaton-mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        working-directory: apps/shipaton-mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/shipaton-mobile
        run: npm run typecheck
      - name: Build web assets
        working-directory: apps/shipaton-mobile
        run: npm run build

  companion-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        working-directory: services/shipaton-ai
        run: npm install --no-audit --no-fund
      - name: Test prompt/runtime contract
        working-directory: services/shipaton-ai
        run: npm test

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install mobile dependencies
        working-directory: apps/shipaton-mobile
        run: npm install --no-audit --no-fund
      - name: Build and add Android
        working-directory: apps/shipaton-mobile
        run: |
          npm run build
          npx cap add android
          npm run assets:android
          npm run android:patch
          npx cap sync android
      - name: Compile debug APK
        working-directory: apps/shipaton-mobile/android
        run: ./gradlew assembleDebug
