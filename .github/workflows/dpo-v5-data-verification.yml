name: DPO V5 P10 Data Verification

on:
  pull_request:
    paths:
      - 'data/train/dpo_v5/**'
      - 'docs/DPO_V5_CORRECTIVE_DATA_SPEC.md'
      - '.github/workflows/dpo-v5-data-verification.yml'

permissions:
  contents: read

jobs:
  verify-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository environment
        run: |
          python -m pip install --upgrade uv
          uv sync --frozen --extra eval

      - name: Assemble and validate V5 P10 records
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          shards = [
              Path('data/train/dpo_v5/conditional_physical_reasoning.jsonl'),
              Path('data/train/dpo_v5/confounding_aware_research_reasoning.jsonl'),
              Path('data/train/dpo_v5/instruction_complete_socratic_tutoring.jsonl'),
              Path('data/train/dpo_v5/bengali_scientific_fidelity_v5.jsonl'),
              Path('data/train/dpo_v5/evidence_first_uncertainty.jsonl'),
              Path('data/train/dpo_v5/multilingual_precision_completion.jsonl'),
          ]
          expected_tracks = {
              'conditional_physical_reasoning': 6,
              'confounding_aware_research_reasoning': 6,
              'instruction_complete_socratic_tutoring': 6,
              'bengali_scientific_fidelity_v5': 4,
              'evidence_first_uncertainty': 4,
              'multilingual_precision_completion': 4,
          }
          records=[]
          for path in shards:
              assert path.is_file(), path
              records += [json.loads(x) for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(records)==30, len(records)
          required={'id','track','domain','language','rejection_reason','prompt','chosen','rejected','metadata'}
          counts={k:0 for k in expected_tracks}
          for r in records:
              assert required <= set(r), r.get('id')
              assert r['id'].startswith('paul_dpo_v5_')
              assert r['track'] in expected_tracks
              counts[r['track']]+=1
              assert r['prompt'].strip() and r['chosen'].strip() and r['rejected'].strip()
              assert r['chosen'] != r['rejected']
              m=r['metadata']
              assert m.get('source')=='post_h6_v5_authored'
              assert m.get('human_verified') is False
              assert m.get('benchmark_leakage_checked') is False
              assert m.get('development_only') is True
              assert m.get('difficulty') and m.get('corrective_category')
          assert counts==expected_tracks, counts
          for key in ('id','prompt','chosen','rejected'):
              vals=[r[key] for r in records]
              assert len(vals)==len(set(vals)), f'duplicate {key}'

          comparison=[]
          for p in ('data/h4_dhe_pilot_v1.jsonl','data/h5_dhe_v3_pilot_v1.jsonl','data/h6_dhe_v4_pilot_v1.jsonl','data/train/dpo_train.jsonl','data/train/dpo_v2_corrective.jsonl'):
              path=Path(p)
              if path.is_file(): comparison += [(p,json.loads(x)) for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]
          for folder in ('data/train/dpo_v3','data/train/dpo_v4'):
              for path in sorted(Path(folder).glob('*.jsonl')):
                  comparison += [(str(path),json.loads(x)) for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]

          prior_prompts={r.get('prompt','') for _,r in comparison}
          prior_completions={r.get(k,'') for _,r in comparison for k in ('chosen','rejected') if r.get(k)}
          assert not {r['prompt'] for r in records}.intersection(prior_prompts), 'exact prior prompt reuse'
          assert not {r['chosen'] for r in records}.intersection(prior_completions), 'exact prior completion reuse'
          assert not {r['rejected'] for r in records}.intersection(prior_completions), 'exact prior completion reuse'

          def toks(s): return set(re.findall(r'\w+', s.lower(), flags=re.UNICODE))
          max_pair=(0.0,None,None)
          for c in records:
              a=toks(c['prompt'])
              for source,p in comparison:
                  b=toks(p.get('prompt','')); u=a|b
                  score=len(a&b)/len(u) if u else 0.0
                  if score>max_pair[0]: max_pair=(score,c['id'],source)
          assert max_pair[0] < 0.35, f'near-duplicate guard failed: {max_pair}'

          payload=''.join(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n' for r in records)
          out=Path('/tmp/dpo_v5_corrective.jsonl'); out.write_text(payload,encoding='utf-8')
          digest=hashlib.sha256(payload.encode('utf-8')).hexdigest()
          expected=Path('data/train/dpo_v5/DATASET_SHA256').read_text(encoding='utf-8').strip()
          assert re.fullmatch(r'[0-9a-f]{64}', expected)
          assert digest==expected, (digest,expected)
          summary={
              'status':'PASS','records':len(records),'track_counts':counts,
              'max_prior_prompt_token_jaccard':max_pair[0],
              'max_prior_prompt_pair':[max_pair[1],max_pair[2]],
              'dataset_sha256':digest,
              'h4_h5_h6_raw_response_text_accessed':False,
              'shae_material_accessed':False,
          }
          Path('/tmp/v5_p10_machine_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Run canonical benchmark leakage checker
        run: uv run python scripts/check_leakage.py /tmp/dpo_v5_corrective.jsonl --json-output /tmp/dpo_v5_leakage_report.json --verbose

      - name: Install Gemini CLI for independent non-human audit
        run: npm install -g @google/gemini-cli

      - name: Independent preference, factuality, language and hard-negative audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          python - <<'PY'
          from pathlib import Path
          data=Path('/tmp/dpo_v5_corrective.jsonl').read_text(encoding='utf-8')
          prompt='''You are an independent conservative reviewer of a development-only DPO preference dataset. Do not edit it. Review all 30 records. For each record check: (1) chosen is clearly preferable for the prompt and rejection_reason; (2) chosen is factually/scientifically/research-methodologically correct; (3) declared-language prose is natural and intelligible, especially Bengali, Hindi and Spanish; (4) chosen fully follows explicit instructions and is complete; (5) rejected is a coherent preference negative with the stated localized defect and is not accidentally better than chosen. Return ONLY valid JSON with schema {"overall_pass": boolean, "records": [{"id": string, "preference_direction_pass": boolean, "factual_pass": boolean, "language_pass": boolean, "completion_pass": boolean, "hard_negative_pass": boolean, "notes": string}], "summary": string}. overall_pass can be true only if every boolean is true for every record. Deliberately flawed rejected answers are not defects unless they make the preference ambiguous.\n\nDATASET:\n'''+data
          Path('/tmp/v5_p10_gemini_prompt.txt').write_text(prompt,encoding='utf-8')
          PY
          gemini --skip-trust -p "$(cat /tmp/v5_p10_gemini_prompt.txt)" > /tmp/v5_p10_gemini_raw.txt
          python - <<'PY'
          import json,re
          from pathlib import Path
          raw=Path('/tmp/v5_p10_gemini_raw.txt').read_text(encoding='utf-8').strip()
          if raw.startswith('```'):
              raw=re.sub(r'^```(?:json)?\s*','',raw); raw=re.sub(r'\s*```$','',raw)
          obj=json.loads(raw); rows=obj.get('records',[])
          assert len(rows)==30, len(rows)
          ids=[r.get('id') for r in rows]; assert len(ids)==len(set(ids))==30
          fields=('preference_direction_pass','factual_pass','language_pass','completion_pass','hard_negative_pass')
          failures=[r for r in rows if not all(r.get(k) is True for k in fields)]
          assert obj.get('overall_pass') is True and not failures, failures
          Path('/tmp/v5_p10_independent_audit.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'status':'PASS','records':30,'review':'independent_non_human'}))
          PY

      - name: Upload V5 P10 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: dpo-v5-p10-audit-evidence
          path: |
            /tmp/v5_p10_machine_summary.json
            /tmp/dpo_v5_leakage_report.json
            /tmp/v5_p10_independent_audit.json
          if-no-files-found: error
          retention-days: 30
