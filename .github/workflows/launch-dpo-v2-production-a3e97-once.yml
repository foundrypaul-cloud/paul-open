name: Launch Validated DPO V2 Production Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/launch-dpo-v2-production-a3e97-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch validated Kaggle DPO V2 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run kaggle-dpo-v2-preflight.yml \
            --repo foundrypaul-cloud/paul-open \
            --ref run/dpo-v2-production-a3e97
