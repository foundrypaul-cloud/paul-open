name: Verify Gemma4 Text Config Hotfix Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dpo-v2-gemma4-config-hotfix-once.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply exact Gemma4 config-surface patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          train = Path('scripts/dpo_v2_e4b_train.py')
          text = train.read_text(encoding='utf-8')
          old = '''    causal_model = model.base_model.model\n    backbone = getattr(causal_model, "model", None)\n    lm_head = getattr(causal_model, "lm_head", None)\n    has_softcap_contract = hasattr(causal_model.config, "final_logit_softcapping")\n    if backbone is None or lm_head is None or not has_softcap_contract:\n        raise RuntimeError("Pinned Gemma policy projection contract changed")\n    outputs = backbone(**model_kwargs)\n    hidden_states = outputs.last_hidden_state[:, :-1]\n    labels = inputs["input_ids"][:, 1:]\n    completion_mask = inputs["completion_mask"][:, 1:]\n    per_token_logps = chunked_selected_logps(\n        hidden_states,\n        labels,\n        lm_head,\n        causal_model.config.final_logit_softcapping,\n        torch,\n        trainer._paul_selective_log_softmax,\n    )\n'''
          new = '''    causal_model = model.base_model.model\n    backbone = getattr(causal_model, "model", None)\n    lm_head = getattr(causal_model, "lm_head", None)\n    model_config = getattr(causal_model, "config", None)\n    get_text_config = getattr(model_config, "get_text_config", None)\n    text_config = get_text_config() if callable(get_text_config) else model_config\n    has_softcap_contract = hasattr(text_config, "final_logit_softcapping")\n    if backbone is None or lm_head is None or not has_softcap_contract:\n        raise RuntimeError(\n            "Pinned Gemma policy projection contract changed: "\n            f"model={type(causal_model).__name__}, "\n            f"backbone={type(backbone).__name__ if backbone is not None else None}, "\n            f"lm_head={type(lm_head).__name__ if lm_head is not None else None}, "\n            f"config={type(model_config).__name__ if model_config is not None else None}, "\n            f"text_config={type(text_config).__name__ if text_config is not None else None}"\n        )\n    outputs = backbone(**model_kwargs)\n    hidden_states = outputs.last_hidden_state[:, :-1]\n    labels = inputs["input_ids"][:, 1:]\n    completion_mask = inputs["completion_mask"][:, 1:]\n    per_token_logps = chunked_selected_logps(\n        hidden_states,\n        labels,\n        lm_head,\n        text_config.final_logit_softcapping,\n        torch,\n        trainer._paul_selective_log_softmax,\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one old projection/config block, found {text.count(old)}')
          train.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_dpo_v2_policy_logps_equivalence.py')
          t = test.read_text(encoding='utf-8')
          old_test = '            self.config = SimpleNamespace(final_logit_softcapping=8.0)\n'
          new_test = '''            text_config = SimpleNamespace(final_logit_softcapping=8.0)\n            self.config = SimpleNamespace(get_text_config=lambda: text_config)\n'''
          if t.count(old_test) != 1:
              raise SystemExit(f'expected one direct synthetic softcap config, found {t.count(old_test)}')
          test.write_text(t.replace(old_test, new_test, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- scripts/dpo_v2_e4b_train.py tests/test_dpo_v2_policy_logps_equivalence.py

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest torch trl transformers peft datasets accelerate

      - name: Run locked DPO verification suites
        run: |
          pytest -q \
            tests/test_dpo_v2_e4b_final_gates.py \
            tests/test_dpo_v2_policy_logps_equivalence.py

      - name: Commit tested patch to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PAUL Foundry.'
          git config user.email 'foundrypaul@gmail.com'
          git add scripts/dpo_v2_e4b_train.py tests/test_dpo_v2_policy_logps_equivalence.py
          git diff --cached --quiet && { echo 'No patch to commit'; exit 1; }
          git commit -m 'fix: use Gemma4 text config for policy softcap'
          git push origin HEAD:main
