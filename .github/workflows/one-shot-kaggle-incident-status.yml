name: One-shot Kaggle Incident Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaggle-incident-status.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Check incident kernel states
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          for slug in \
            paul-open-dpo-v3-preflight \
            paul-open-dpo-v4-production \
            paul-open-dpo-v5-production
          do
            echo "=== ${slug} ==="
            kaggle kernels status "paulfoundry/${slug}"
          done
