name: H6 DHE Controlled Unblind

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h6-dhe-controlled-unblind.yml'
      - 'data/h6_dhe_v4_pilot_v1_blinded_analysis_lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unblind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: paulfoundry
      H6_KERNEL: paulfoundry/paul-open-h6-dhe-v4-paired-generation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Verify blinded analysis lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('data/h6_dhe_v4_pilot_v1_blinded_analysis_lock.json').read_text())
          assert lock['state']=='BLINDED_ANALYSIS_LOCKED'
          assert lock['experiment']=='H6_DHE_V4_PILOT_V1'
          assert lock['partition']=='development'
          assert lock['batch_id']=='HEB1-5AE2CE4166CD'
          assert lock['collection']['collected']==18
          assert lock['collection']['target']==18
          assert lock['collection']['adaptive_escalation_required'] is False
          assert lock['collection']['forms_closed'] is True
          assert lock['durability']['status']=='PASS'
          assert lock['durability']['raw_response_count']==18
          assert lock['durability']['normalized_row_count']==18
          assert lock['durability']['backup_row_count']==18
          assert lock['durability']['packet_response_ids_match'] is True
          assert lock['durability']['all_backup_rows_have_sha256'] is True
          assert lock['blinding']['private_mapping_opened'] is False
          assert lock['blinding']['source_identity_used_in_lock'] is False
          assert lock['blinding']['shae_accessed'] is False
          assert len(lock['blinded_case_results'])==6
          assert sum(r['judgments'] for r in lock['blinded_case_results'])==18
          print('H6 blinded analysis lock verified')
          PY
      - name: Download private H6 kernel output
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          mkdir -p "$RUNNER_TEMP/h6-private"
          kaggle kernels output "$H6_KERNEL" -p "$RUNNER_TEMP/h6-private"
          MAPPING=$(find "$RUNNER_TEMP/h6-private" -type f -path '*/private_mapping/mapping.json' -print -quit)
          test -n "$MAPPING"
          echo "MAPPING=$MAPPING" >> "$GITHUB_ENV"
      - name: Create safe H6 unblinded aggregate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h6-unblinded-safe
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          lock=json.loads(Path('data/h6_dhe_v4_pilot_v1_blinded_analysis_lock.json').read_text())
          mp=Path(os.environ['MAPPING'])
          mapping=json.loads(mp.read_text())
          if mapping.get('batch_id') != lock['batch_id']:
              raise SystemExit('private mapping batch mismatch')
          labels={mapping['sources']['left']['label'], mapping['sources']['right']['label']}
          expected={'sft_reference','dpo_v4_corrective'}
          if labels != expected:
              raise SystemExit(f'unexpected source labels: {sorted(labels)}')

          entries={e['comparison_id']:e for e in mapping['entries']}
          source_metric={'dpo_v4_corrective':'candidate_preferred','sft_reference':'reference_preferred'}
          totals={'candidate_preferred':0,'reference_preferred':0,'about_equal':0,'neither_good':0,'not_sure':0}
          by_case={}

          for row in lock['blinded_case_results']:
              outcome=row['canonical_v01_outcome']
              judgments=int(row['judgments'])
              out={k:0 for k in totals}
              if outcome in ('A','B'):
                  entry=entries.get(row['comparison_id'])
                  if entry is None:
                      raise SystemExit(f"mapping missing comparison for {row['case']}")
                  source=entry['response_a_source'] if outcome=='A' else entry['response_b_source']
                  metric=source_metric[source]
              elif outcome=='NEITHER':
                  metric='neither_good'
              elif outcome=='EQUAL':
                  metric='about_equal'
              elif outcome=='NOT_SURE':
                  metric='not_sure'
              else:
                  raise SystemExit(f"unexpected locked outcome for {row['case']}: {outcome}")
              out[metric]=judgments
              totals[metric]+=judgments
              by_case[row['case'].lower()]=out

          if sum(totals.values()) != 18:
              raise SystemExit('aggregate judgment total mismatch')
          mapping_hash=hashlib.sha256(mp.read_bytes()).hexdigest()
          result={
              'schema_version':'1.0',
              'experiment':'H6_DHE_V4_PILOT_V1',
              'partition':'development',
              'batch_id':lock['batch_id'],
              'state':'UNBLINDED_AGGREGATE_READY',
              'analysis_lock_state':lock['state'],
              'analysis_lock_judgments':18,
              'candidate':'dpo_v4_corrective',
              'reference':'sft_reference',
              'mapping_sha256':mapping_hash,
              'totals':totals,
              'by_case':by_case,
              'unanimous_cases':lock['summary']['unanimous_cases'],
              'mapping_content_exposed':False,
              'private_case_ids_exposed':False,
              'private_seed_exposed':False,
              'shae_accessed':False,
              'note':'Safe aggregate only. The private A/B mapping, seed, fingerprints, and private case IDs are intentionally omitted.'
          }
          Path('h6-unblinded-safe/h6_unblinded_aggregate.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':'PASS','judgments':18,'safe_output':'h6_unblinded_aggregate.json'}))
          PY
      - name: Assert private material is absent
        shell: bash
        run: |
          set -euo pipefail
          test "$(find h6-unblinded-safe -type f | wc -l)" -eq 1
          ! grep -R '"seed"' h6-unblinded-safe
          ! grep -R '"case_id"' h6-unblinded-safe
          ! grep -R 'response_a_source' h6-unblinded-safe
          ! grep -R 'response_b_source' h6-unblinded-safe
      - name: Upload safe H6 unblinding aggregate
        uses: actions/upload-artifact@v4
        with:
          name: h6-dhe-unblinded-safe-aggregate
          path: h6-unblinded-safe/h6_unblinded_aggregate.json
          if-no-files-found: error
          retention-days: 30
