name: H6 DHE V4 Failure Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-failure-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: paulfoundry
      H6_KERNEL_SLUG: paul-open-h6-dhe-v4-paired-generation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Download private H6 failure evidence and allowlist public fields
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_OUTPUT="$RUNNER_TEMP/h6-kaggle-output"
          mkdir -p "$PRIVATE_OUTPUT" h6-failure-evidence
          kaggle kernels output "$KAGGLE_USERNAME/$H6_KERNEL_SLUG" -p "$PRIVATE_OUTPUT"
          python scripts/sanitize_kaggle_public_evidence.py \
            --input "$PRIVATE_OUTPUT" \
            --output h6-failure-evidence/failure_summary.json
          printf '%s\n' \
            'Private H6 generation failed. Public evidence is intentionally limited to allowlisted aggregate failure fields.' \
            > h6-failure-evidence/README.txt
      - name: Upload sanitized failure evidence only
        uses: actions/upload-artifact@v4
        with:
          name: h6-dhe-v4-sanitized-failure-evidence
          path: h6-failure-evidence
          if-no-files-found: error
          retention-days: 14
