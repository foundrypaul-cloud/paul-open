name: Recover Kaggle DPO V2 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recover-kaggle-dpo-v2-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel superseded run and dispatch corrected workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST repos/foundrypaul-cloud/paul-open/actions/runs/34310650096/force-cancel >/dev/null || true
          gh workflow run kaggle-dpo-v2-preflight.yml --repo foundrypaul-cloud/paul-open --ref main
