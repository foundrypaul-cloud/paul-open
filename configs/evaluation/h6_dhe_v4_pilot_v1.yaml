h6_dhe_v4_pilot:
  version: "1.2"
  status: "frozen_pre_generation"
  partition: "development"
  case_manifest: "data/h6_dhe_v4_pilot_v1.jsonl"
  p11_p12_evidence: "docs/DPO_V4_P11_P12_RESULTS.md"

  base_model:
    id: "google/gemma-4-E4B-it"
    revision: "ee0ef6023621cff504d758262d4e04895a5af4a2"
    config: "configs/models/gemma4_e4b_it.yaml"

  sources:
    reference:
      private_label: "sft_reference"
      logical_adapter: "paulfoundry/paul-open-sft"
      adapter_config_sha256: "cff65bd42928536886168b09d9b133b25ac444c01d901d2a56d98c7b8b03a0ce"
      adapter_weights_sha256: "73bab121009e2130f387b5deebfe1d15f4f7ac2afbd622164b11b3024000ec49"
    candidate:
      private_label: "dpo_v4_corrective"
      experiment_id: "paul_e4b_dpo_v4_corrective"
      source_revision: "6bd98c516ed1c4c53251ba4a9bbb6507d4b9cb73"
      production_run: 34704441705
      production_artifact: 10301858693
      adapter_config_sha256: "8e601627e6c9a256ed37acffb747c64e675f176ef92950470c6e85f7f09f146e"
      adapter_weights_sha256: "773116e424401dc7009421616c303a0688ce2f1bc7191f2d61b715a447f44b8b"

  generation:
    matched_between_sources: true
    max_new_tokens: 768
    require_eos_before_limit: true
    response_instruction: >-
      For this evaluation, give a complete but concise answer that a reviewer can
      read comfortably in about 1–2 minutes. Aim for no more than about 300 words,
      or an equivalent reading length in the requested language. Prioritize the
      most important reasoning rather than exhaustively listing every possibility.
    temperature: 0.7
    top_p: 0.9
    random_seed: 42
    chat_template: "tokenizer_apply_chat_template"
    add_generation_prompt: true
    notes: >-
      Audit amendment 2026-09-13 v1.2: the initial 256-token H6 generation produced
      reviewer-visible truncation, and H6-DHE-003 still reached a 768-token ceiling
      without EOS under v1.1. Both checkpoints now receive the same neutral concision
      instruction, which is also included verbatim in the reviewer-visible prompt.
      The 768-token ceiling remains only as a fail-closed backstop. Model/adapters,
      six case prompts, tokenizer/chat formatting, sampling settings, base-model
      revision, and runtime generation path remain otherwise unchanged.

  required_outputs:
    reference_jsonl: "outputs/h6_dhe/private/sft_reference.jsonl"
    candidate_jsonl: "outputs/h6_dhe/private/dpo_v4_corrective.jsonl"
    generation_manifest: "outputs/h6_dhe/private/generation_manifest.json"
    baseline_leakage_report: "outputs/h6_dhe/private/baseline_leakage_report.json"
    development_separation_report: "outputs/h6_dhe/private/development_separation_report.json"
    public_bundle_dir: "outputs/human_eval/public/h6_dhe_v4_pilot_v1"
    private_mapping: ".human-eval-private/h6_dhe_v4_pilot_v1_mapping.json"

  pre_form_gates:
    - "generation_completed"
    - "nonempty_output"
    - "no_generation_truncation_gate"
    - "display_prompt_matches_generation_prompt"
    - "automated_safety_gate"
    - "malformed_output_gate"
    - "evaluation_partition_integrity"
    - "canonical_baseline_contamination_gate"
    - "h4_h5_and_prior_dpo_training_separation_gate"

  human_batch:
    builder: "scripts/build_human_eval_batch.py"
    partition: "development"
    variant_count: 2
    deterministic_seed_required: true
    default_comparisons_per_form: 3

  review_allocation:
    initial_valid_judgments_per_case: 3
    disagreement_escalation_total: 5
    exceptional_hard_cap: 7

  interpretation:
    regression_flags_carried_forward:
      - "science_reasoning"
      - "student_assistance"
      - "socratic_tutoring"
      - "scientific_research_assistance"
      - "bengali"
      - "small_n_multilingual_behavior"
    preservation_checks:
      - "hindi_scientific_calibration"
      - "teacher_assistance"
      - "human_centered_evidence_first"
      - "multilingual_translation"

  prohibitions:
    expose_private_source_labels_to_reviewers: false
    publish_private_mapping: false
    reuse_h3_cases: false
    reuse_h4_cases: false
    reuse_h5_cases: false
    reuse_prior_dpo_training_prompts: false
    reuse_v4_training_prompts: false
    reuse_canonical_baseline_cases: false
    use_shae_material: false
    treat_h6_as_final_superiority_evidence: false
