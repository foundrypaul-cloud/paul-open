# =============================================================================
# PAUL Open Model — Gemma 4 31B IT Configuration (MAXIMUM CAPABILITY)
# =============================================================================
# HuggingFace ID: google/gemma-4-31B-it
# Role: MAXIMUM CAPABILITY & BENCHMARK CEILING
# Architecture: gemma4 (dense multimodal transformer)
# Parameters: ~31B dense
# Context window: 262,144 tokens (256K)
# Modality: Multimodal (Text, Image)
# License: Apache 2.0
# =============================================================================

model:
  name: "gemma-4-31b-it"
  role: "maximum_capability"
  hf_model_id: "google/gemma-4-31B-it"
  hf_base_model_id: "google/gemma-4-31B"
  architecture: "gemma4"
  pipeline_tag: "image-text-to-text"
  parameter_count: "31B"
  context_length: 262144
  dtype: "bfloat16"
  is_multimodal: true

  text_only_requires_mm_ids: true

  quantization:
    method: "qlora"
    bits: 4
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true

  lora:
    r: 64
    alpha: 128
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    dropout: 0.05
    task_type: "CAUSAL_LM"
    modules_to_save: null

  device_map: "auto"

  vram_estimates:
    bf16_full: "~62 GB"
    qlora_4bit: "~20 GB"
    qlora_4bit_training: "~28 GB"

  notes: |
    MAXIMUM CAPABILITY MODEL.
    Highest parameter density in the Gemma 4 family.
    Used for final upper-bound benchmarking, complex multi-step reasoning, and high-resource runs.
    Requires multi-GPU (e.g., 2x 24 GB) or A100/H100 80 GB instances for training.
