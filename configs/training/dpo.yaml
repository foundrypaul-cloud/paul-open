training:
  method: dpo
  dpo_config:
    output_dir: ./results/dpo_v2
    num_train_epochs: 1
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 8
    learning_rate: 5.0e-07
    beta: 0.1
    max_length: 4096
    max_prompt_length: 2048
    remove_unused_columns: false
    bf16: false
    fp16: true
    save_strategy: steps
    save_steps: 500
    save_total_limit: 3
    eval_strategy: steps
    eval_steps: 500
    logging_steps: 10
    logging_dir: ./tb_logs/dpo_v2
    report_to: tensorboard
    seed: 42
    gradient_checkpointing: true
    optim: paged_adamw_8bit
  gemma4_text_only:
    inject_mm_token_type_ids: true
    inject_token_type_ids: true
