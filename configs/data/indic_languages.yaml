# Data pipeline config for Indic/multilingual language data
# Target languages: English, Hindi, Bengali, Assamese, Tamil, Telugu

data:
  name: "indic_languages"
  languages:
    - code: "en"
      name: "English"
    - code: "hi"
      name: "Hindi"
    - code: "bn"
      name: "Bengali"
    - code: "as"
      name: "Assamese"
    - code: "ta"
      name: "Tamil"
    - code: "te"
      name: "Telugu"

  # Candidate datasets (planning metadata only — not downloaded by this config)
  candidate_sources:
    - name: "IndicCorp v2"
      type: "monolingual_candidate_training"
      license: "CC0-1.0"
      notes: "Large-scale monolingual corpus; provenance review still required before training/release"
    - name: "Samanantar"
      type: "evaluation_only_pending_license_resolution"
      license: "REVIEW_REQUIRED"
      notes: "HF metadata reports CC-BY-NC-4.0 while upstream project text has also described CC0 packaging; do not train or redistribute until resolved"
    - name: "IN22"
      type: "evaluation"
      license: "CC-BY-4.0"
      notes: "AI4Bharat multi-way parallel evaluation set; keep out of training to preserve benchmark integrity"

  preprocessing:
    max_length: 4096
    deduplicate: true
    filter_low_quality: true
